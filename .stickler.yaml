# Per-repo lint delta, deep-merged onto the distribute-owned .golangci.yaml.
#
# sqlid computes the Oracle-style SQL_ID, which is *defined* as the MD5 digest of
# the statement text (see sqlid.go). MD5 here is a non-cryptographic content
# fingerprint — never used for passwords, signatures, or integrity against an
# adversary — and the algorithm is fixed by the Oracle spec and the Python parity
# corpus, so it cannot be swapped for a stronger hash without breaking the
# contract. gosec G501 (blocklisted crypto/md5 import) and G401 (weak crypto
# primitive) are therefore genuine false-positives in this non-security context.
config:
  golangci-lint:
    linters:
      settings:
        gosec:
          excludes: { add: [G401, G501] }

# `soft:` is what makes a rule non-gating; `soft-baseline:` is only the
# per-rule ceiling APPLIED TO the rules named here. A baseline without a
# matching soft entry is inert — the rule stays hard and fails on its first
# finding whatever number is recorded beside it.
soft:
  # `add` MERGES with the global soft list; a plain sequence would REPLACE
  # it and silently harden every centrally-softened rule in this repo.
  add:
    - yze/clidomain

soft-baseline:
  # Recorded from the 2026-08-02 full-suite sweep (stickler v0.10.0 /
  # yze v0.31.0): the counts at first contact with the current soft rule
  # set, on the ratchet — they may only fall. Probes (invariant, filesize,
  # enumdiscrim) await adjudication; rollout rules (errtest, errtested,
  # testfile, clidomain, cliflags, clilayout, fuzzreq, exhaustive) gate
  # again at zero.
  yze/fuzzreq: 1
